<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description">
  <title id="title">OpenStack from zero: planned lab</title>
  <desc id="description">R2d2 initiates SSH through the hypervisor NAT path to the management LAN. The three nodes are controllers, and node2 and node3 are also computes. Built-in NICs carry host management; USB NICs will carry external VM traffic. Cinder LVM is planned on node3's SATA disk. NAT routing, USB cabling and current disk identities still need verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#3a678e"/></marker>
    <style>
      text{font-family:DejaVu Sans,Arial,sans-serif;fill:#19324a}
      .title{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#536879}
      .head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px}
      .blue{fill:#25658b}.green{fill:#18705a}.muted{fill:#536879}
      .card{fill:#fff;stroke:#cbd8e2;stroke-width:2}
      .management{stroke:#3a678e;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .pending{stroke:#bd8a38;stroke-width:3;stroke-dasharray:7 5;fill:none}
    </style>
  </defs>
  <rect width="1120" height="790" rx="18" fill="#f5f8fb"/>
  <text x="40" y="52" class="title">Your OpenStack lab</text>
  <text x="40" y="80" class="sub">Planned service placement • Phase 1 prepares the machines and verifies access</text>

  <rect x="322" y="108" width="476" height="116" rx="14" fill="#e8f1fa" stroke="#91b2cf" stroke-width="2"/>
  <text x="346" y="143" class="head blue">R2d2 — management VM</text>
  <text x="346" y="173" class="body">Git + Ansible + Kolla-Ansible, later Terraform</text>
  <text x="346" y="202" class="small muted">NAT address and hypervisor: to observe</text>

  <path d="M560 224 V303" class="management"/>
  <rect x="584" y="241" width="346" height="47" rx="8" fill="#f5f8fb"/>
  <text x="600" y="260" class="small">Outbound SSH through NAT</text>
  <text x="600" y="281" class="small muted">Actual route is tested from R2d2</text>

  <rect x="38" y="311" width="1044" height="58" rx="12" fill="#dfebf5" stroke="#a7bfd2"/>
  <text x="560" y="347" class="body" text-anchor="middle">Management LAN • 192.168.0.0/24 • built-in NIC on each node</text>
  <path d="M206 369 V407" class="management"/>
  <path d="M560 369 V407" class="management"/>
  <path d="M914 369 V407" class="management"/>

  <rect x="38" y="417" width="336" height="214" rx="14" class="card"/>
  <rect x="392" y="417" width="336" height="214" rx="14" class="card"/>
  <rect x="746" y="417" width="336" height="214" rx="14" class="card"/>
  <text x="62" y="453" class="head">node1</text>
  <text x="62" y="481" class="body blue">192.168.0.200</text>
  <text x="62" y="519" class="body">Controller</text>
  <text x="62" y="550" class="small muted">Manages cloud requests</text>
  <text x="62" y="606" class="small">Ubuntu Server 24.04 LTS</text>
  <text x="416" y="453" class="head">node2</text>
  <text x="416" y="481" class="body blue">192.168.0.201</text>
  <text x="416" y="519" class="body">Controller + compute</text>
  <text x="416" y="550" class="small muted">Manages requests and runs VMs</text>
  <text x="416" y="606" class="small">Ubuntu Server 24.04 LTS</text>
  <text x="770" y="453" class="head">node3</text>
  <text x="770" y="481" class="body blue">192.168.0.202</text>
  <text x="770" y="519" class="body">Controller + compute</text>
  <rect x="767" y="538" width="294" height="40" rx="7" fill="#e5f3ec"/>
  <text x="779" y="564" class="small green">Planned: SATA disk → Cinder LVM</text>
  <text x="770" y="606" class="small">Ubuntu Server 24.04 LTS</text>

  <path d="M206 631 V679 M560 631 V679 M914 631 V679" class="pending"/>
  <rect x="38" y="681" width="1044" height="62" rx="12" fill="#fff5e2" stroke="#d7b77a"/>
  <text x="560" y="707" class="body" text-anchor="middle">USB NIC on each node → external VM traffic</text>
  <text x="560" y="730" class="small muted" text-anchor="middle">Host IP: none • physical cabling and provider-network settings: to confirm</text>
  <text x="40" y="774" class="small muted">Solid blue: intended management path. Dashed amber: provider path awaiting configuration.</text>
</svg>
