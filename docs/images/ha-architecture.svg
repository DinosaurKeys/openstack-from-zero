<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1110" viewBox="0 0 1100 1110" role="img" aria-labelledby="title desc">
<title id="title">Three-node OpenStack: API, database and virtual-router HA</title>
<desc id="desc">API clients use the shared API VIP managed by API Keepalived and HAProxy. Three nodes host Galera members and HA-capable Neutron agents. A logical HA router has one active and two standby replicas, using the active node's USB connection for external VM traffic. Local Glance and Cinder storage are not replicated.</desc>
<defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18364c}.title{font-size:29px;font-weight:bold}.head{font-size:21px;font-weight:bold}.body{font-size:17px}.small{font-size:15px;fill:#496779}.box{fill:#fff;stroke:#bbcedd;stroke-width:2}.line{fill:none;stroke:#37697c;stroke-width:3;marker-end:url(#a)}.dash{stroke-dasharray:7 5}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#37697c"/></marker></defs>
<rect width="1100" height="1110" rx="18" fill="#f3f8fb"/>
<text x="40" y="48" class="title">OpenStack HA: three separate mechanisms</text>
<text x="40" y="78" class="body">Design and verification targets · fresh deployment and failover results required</text>
<rect x="330" y="105" width="440" height="55" rx="10" class="box"/><text x="550" y="139" text-anchor="middle" class="head">Browser / API client</text>
<path d="M550 160V190" class="line"/>
<rect x="180" y="200" width="740" height="85" rx="12" class="box"/>
<text x="550" y="234" text-anchor="middle" class="head">API VIP: 192.168.0.151</text><text x="550" y="262" text-anchor="middle" class="body">API Keepalived: one owner · HAProxy: service frontends</text>
<path d="M550 285V320" class="line"/>
<rect x="100" y="330" width="900" height="84" rx="12" class="box"/>
<text x="550" y="363" text-anchor="middle" class="head">Horizon + service APIs</text><text x="550" y="392" text-anchor="middle" class="body">Keystone · Nova · Neutron · Glance · Cinder · Placement</text>
<text x="40" y="458" class="head">Three nodes: controller + network + compute + local Cinder LVM</text>

<rect x="55" y="500" width="300" height="140" rx="12" class="box"/><rect x="400" y="500" width="300" height="140" rx="12" class="box"/><rect x="745" y="500" width="300" height="140" rx="12" class="box"/>
<text x="205" y="534" text-anchor="middle" class="head">node1 · .200</text><text x="550" y="534" text-anchor="middle" class="head">node2 · .201</text><text x="895" y="534" text-anchor="middle" class="head">node3 · .202</text>
<text x="205" y="566" text-anchor="middle" class="body">Galera member</text><text x="550" y="566" text-anchor="middle" class="body">Galera member</text><text x="895" y="566" text-anchor="middle" class="body">Galera member</text>
<text x="205" y="596" text-anchor="middle" class="body">Neutron L3 / DHCP / OVS</text><text x="550" y="596" text-anchor="middle" class="body">Neutron L3 / DHCP / OVS</text><text x="895" y="596" text-anchor="middle" class="body">Neutron L3 / DHCP / OVS</text>
<text x="205" y="622" text-anchor="middle" class="small">Built-in NIC + separate USB</text><text x="550" y="622" text-anchor="middle" class="small">Built-in NIC + separate USB</text><text x="895" y="622" text-anchor="middle" class="small">Built-in NIC + separate USB</text>
<path d="M355 568H395M700 568H740" class="line"/>
<text x="550" y="675" text-anchor="middle" class="small">Galera: three synced members, quorum and service records · RabbitMQ: service messaging</text>
<line x1="40" y1="700" x2="1060" y2="700" stroke="#bbcedd" stroke-width="2"/>
<text x="40" y="740" class="head">VM traffic: separate Neutron virtual-router HA</text>
<text x="40" y="770" class="body">VM private network → lab-router · gateway 10.10.10.1</text>
<rect x="80" y="795" width="940" height="85" rx="12" class="box"/>
<text x="550" y="829" text-anchor="middle" class="head">One active router replica + two standby replicas</text><text x="550" y="858" text-anchor="middle" class="body">Per-router Keepalived / VRRP · elected node can change</text>
<path d="M550 880V910" class="line"/>
<rect x="80" y="920" width="940" height="80" rx="12" class="box"/>
<text x="550" y="952" text-anchor="middle" class="head">Active node: br-ex → USB NIC → home switch/router</text><text x="550" y="980" text-anchor="middle" class="body">Router external IP allocated from 192.168.0.152–199 · USB has no host IP</text>
<text x="40" y="1040" class="small">Management + VXLAN underlay: built-in NICs. Both NICs share the same home switch.</text>
<text x="40" y="1070" class="small">Limits: node1 Glance file storage and local Cinder volumes are not replicated; no automatic VM recovery.</text>
</svg>
