<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title description">
<title id="title">Three nodes: separate Ubuntu and Cinder storage</title><desc id="description">Each node has existing Ubuntu storage on NVMe and one inspected 240 GB SATA disk. Each SATA disk now supplies one physical volume in a verified empty local cinder-volumes volume group. There is no replication between nodes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3a678e"/></marker><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#19324a}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:15px;fill:#536879}.line{stroke:#3a678e;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1120" height="740" rx="18" fill="#f5f8fb"/>
<text x="32" y="48" class="title">Three nodes — Ubuntu stays separate from Cinder</text>
<text x="32" y="78" class="small">Pool creation verified on all three nodes: one SATA PV and zero LVs per local pool.</text>
<rect x="32" y="104" width="332" height="552" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="2"/>
<text x="50" y="141" class="head">node1</text>
<text x="50" y="168" class="small">192.168.0.200</text>
<rect x="48" y="190" width="300" height="102" rx="12" fill="#e8f1fa" stroke="#91b2cf" stroke-width="2"/>
<text x="62" y="222" class="body">NVMe — existing Ubuntu</text>
<text x="62" y="249" class="small">ubuntu-vg → ubuntu-lv → /</text>
<text x="62" y="273" class="small">Boot partitions also use NVMe</text>
<rect x="48" y="316" width="300" height="110" rx="12" fill="#e5f3ec" stroke="#84b99c" stroke-width="2"/>
<text x="62" y="348" class="body">Kingston UV400 SATA · 240 GB</text>
<text x="62" y="375" class="small">Serial: 50026B7766070422</text>
<text x="62" y="401" class="small">Identity and existing use reviewed</text>
<path d="M332 427 L332 479" class="line"/>
<text x="50" y="457" class="small">Done: pvcreate + vgcreate</text>
<rect x="48" y="490" width="300" height="144" rx="12" fill="#e5f3ec" stroke="#84b99c" stroke-width="2"/>
<text x="62" y="523" class="head">VG: cinder-volumes</text>
<text x="62" y="550" class="small">Uses this node’s SATA PV only</text>
<text x="62" y="576" class="small">Verified: 1 PV, 0 LVs</text>
<text x="62" y="605" class="small">Cinder creates VM volumes later</text>
<rect x="394" y="104" width="332" height="552" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="2"/>
