<text x="786" y="605" class="small">Cinder creates VM volumes later</text>
<text x="32" y="689" class="body">Three separate local pools. Same VG name on each host; no shared pool or automatic replicas.</text>
<text x="32" y="719" class="small">Blue: existing Ubuntu. Green: inspected SATA and verified empty LVM pools. VM volumes come later.</text>
