<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="366" viewBox="0 0 1000 366" role="img" aria-labelledby="title description">
  <title id="title">Node3 storage: Ubuntu and planned Cinder pool</title>
  <desc id="description">Ubuntu currently uses the NVMe disk. The separate Kingston SATA disk is the candidate for a future cinder-volumes LVM pool and persistent VM volumes. The SATA disk is being inspected; the Cinder pool has not been created.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3a678e"/></marker>
    <style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#19324a}.head{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px;fill:#536879}.line{stroke:#3a678e;stroke-width:3;fill:none;marker-end:url(#arrow)}.planned{stroke-dasharray:6 5}</style>
  </defs>
  <rect width="1000" height="366" rx="16" fill="#f5f8fb"/>
  <text x="30" y="43" class="head">node3 — two disks, two jobs</text>
  <rect x="30" y="72" width="252" height="90" rx="12" fill="#e8f1fa" stroke="#91b2cf"/>
  <text x="50" y="105" class="label">NVMe disk</text>
  <text x="50" y="134" class="small">Existing Ubuntu storage</text>
  <path d="M282 117 H368" class="line"/>
  <rect x="378" y="72" width="282" height="90" rx="12" fill="#e8f1fa" stroke="#91b2cf"/>
  <text x="398" y="105" class="label">Ubuntu LVM → /</text>
  <text x="398" y="134" class="small">Operating system</text>
  <rect x="30" y="209" width="252" height="98" rx="12" fill="#e5f3ec" stroke="#84b99c"/>
  <text x="50" y="242" class="label">Kingston SATA disk</text>
  <text x="50" y="269" class="small">240 GB • inspect now</text>
  <text x="50" y="292" class="small">Serial ends 7883A</text>
  <path d="M282 258 H368" class="line planned"/>
  <rect x="378" y="209" width="282" height="98" rx="12" fill="#fff5e2" stroke="#d7b77a" stroke-dasharray="6 5"/>
  <text x="398" y="246" class="label">cinder-volumes</text>
  <text x="398" y="276" class="small">Planned LVM storage pool</text>
  <path d="M660 258 H728" class="line planned"/>
  <rect x="738" y="209" width="232" height="98" rx="12" fill="#fff5e2" stroke="#d7b77a" stroke-dasharray="6 5"/>
  <text x="758" y="246" class="label">VM volumes</text>
  <text x="758" y="276" class="small">Created later by Cinder</text>
  <text x="30" y="342" class="small">Solid: existing Ubuntu storage. Dashed: planned storage, not created yet.</text>
</svg>
