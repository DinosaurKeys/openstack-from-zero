<text x="424" y="249" class="small">ubuntu-vg → ubuntu-lv → /</text>
<text x="424" y="273" class="small">Boot partitions also use NVMe</text>
<rect x="410" y="316" width="300" height="110" rx="12" fill="#e5f3ec" stroke="#84b99c" stroke-width="2"/>
